{%extends 'layout.html'%}

{% block title %}
    {{ post.title }}
{% endblock %}

{% block content %}
    <section>
        <img
            class="banner"
            src="{{ post.banner.url }}"
            alt="{{ post.title}}"
        />
        <h1>{{ post.title }}</h1>
            <div class="report-meta">
                <p>{{ post.date }}</p>

                <span class="report-categoria">
                    {{ post.get_categoria_display }}
                </span>
            </div>
            <p class="report-body">{{ post.body }}</p>
            <div id="map" style="height:400px;"></div>
    </section>
<script>
document.addEventListener('DOMContentLoaded', function () {

    const map = L.map('map').setView(
        [{{ post.latitude }}, {{ post.longitude }}],
        14
    );

    L.tileLayer(
        'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
        {
            attribution: 'Tiles © Esri'
        }
    ).addTo(map);

    L.marker([
        {{ post.latitude }},
        {{ post.longitude }}
    ]).addTo(map);

});
</script>

{% endblock %}
