<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% block title%}
            Django App
        {% endblock %}
    </title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet/dist/leaflet.css"
    />
    <script src="{% static 'js/main.js' %}" defer></script>
</head>
<body>
    <nav>
        <a href="/">Inicio</a> |
        <a href="/about">Info</a> |
        <a href="{% url 'posts:list' %}">Reportes</a> |
        
        {% if user.is_authenticated %}
            <a href="{% url 'posts:new-post' %}">Nuevo Reporte</a> |
            <a href="/admin">Admin</a> |
            <form class="logout" action="{% url 'users:logout' %}" method="post">
                {% csrf_token %}
                <button class="logout-button" title="User Logout">Logout</button>
            </form>
        {% else %}
            <a href="{% url 'users:register' %}">Registrarse</a> |
            <a href="{% url 'users:login' %}">Iniciar sesión</a> |
        {% endif %}
    </nav>
    <main>
        {% block content %}
        {% endblock %}
    </main>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
</body>
</html>
