<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% block title%}
            Django App
        {% endblock %}
    </title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link 
        rel="stylesheet"
        href="https://unpkg.com/leaflet/dist/leaflet.css"
    />
    <script src="{% static 'js/main.js' %}" defer></script>
</head>
<body style="margin: 0; padding: 0; background-color: #f1f5f9; position: relative;">

    <nav style="position: relative; z-index: 10;">
        <a href="/">Inicio</a> |
        <a href="/about">Info</a> |
        <a href="{% url 'posts:list' %}">Reportes</a> |

        {% if user.is_authenticated %}
            <a href="/admin">Admin</a> |
            <form class="logout" action="{% url 'users:logout' %}" method="post" style="display:inline;">
                {% csrf_token %}
                <button class="logout-button" style="font-family: inherit; font-size: inherit; color: inherit; background: none; border: none; padding: 0; cursor: pointer; text-decoration: none;" title="User Logout">Cerrar sesión</button>
            </form> |
        {% else %}
            <a href="{% url 'users:register' %}">Registrarse</a> |
            <a href="{% url 'users:login' %}">Iniciar sesión</a> |
        {% endif %}
    </nav>

    <!-- Fondo costero -->
    <div style="position: absolute; top: 0; left: 0; width: 100vw; height: 500px; overflow: hidden; z-index: 1; pointer-events: none; -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0.95) 20%, rgba(0,0,0,0) 100%); mask-image: linear-gradient(to bottom, rgba(0,0,0,0.95) 20%, rgba(0,0,0,0) 100%);">
        <img src="https://images.unsplash.com/photo-1516483638261-f4dbaf036963?w=1920&auto=format&fit=crop" 
             alt="Vista costera" 
             style="width: 100%; height: 100%; object-fit: cover; object-position: center 50%; filter: blur(3px); transform: scale(1.03); display: block;">
    </div>

    <main style="position: relative; z-index: 2;">
        {% block content %}
        {% endblock %}
    </main>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
</body>
</html>
