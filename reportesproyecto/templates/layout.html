<!DOCTYPE html>
{% load static %}
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% block title %}
            SalvaRamos
        {% endblock %}
    </title>

    <!-- Tipografías: Bricolage Grotesque (títulos) + Source Sans 3 (texto) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="{% static 'js/main.js' %}" defer></script>
</head>
<body>

    <nav class="navbar">
        <a href="/" class="navbar-brand">SalvaRamos</a>

        <div class="navbar-links">
            <a href="/">Inicio</a>
            <a href="/about">Info</a>
            <a href="{% url 'posts:list' %}">Reportes</a>

            {% if user.is_authenticated %}
                <a href="/admin">Admin</a>
                <form class="logout" action="{% url 'users:logout' %}" method="post">
                    {% csrf_token %}
                    <button class="logout-button" title="Cerrar sesión">Cerrar sesión</button>
                </form>
            {% else %}
                <a href="{% url 'users:register' %}">Registrarse</a>
                <a href="{% url 'users:login' %}" class="nav-cta">Iniciar sesión</a>
            {% endif %}
        </div>
    </nav>

    <!-- Las páginas normales usan "container" (tarjeta blanca centrada).
         La portada lo reemplaza por nada para ocupar toda la pantalla. -->
    <main class="{% block main_class %}container{% endblock %}">
        {% block content %}
        {% endblock %}
    </main>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
</body>
</html>
